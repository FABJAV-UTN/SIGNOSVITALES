[project]
name = "backend"
version = "0.1.0"
description = "Backend FastAPI para registro de signos vitales - Cruz Roja Argentina"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.31",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
