services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: vital_backend
    volumes:
      - ./backend/data:/app/data
    # Sin "ports": el backend solo es accesible dentro de la red de Docker.
    # El frontend (Nginx) le pasa las peticiones /api/. Así nadie de la red wifi
    # puede consultar la API directamente en el puerto 8000.
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - vital-net
    environment:
      - TZ=America/Argentina/Buenos_Aires
      # Se leen del archivo .env de la raíz del proyecto (ver .env.example).
      - SISVAP_ADMIN_PASSWORD=${SISVAP_ADMIN_PASSWORD:?Falta SISVAP_ADMIN_PASSWORD en .env (copiá .env.example como .env)}
      - SISVAP_VOLUNTARIO_PASSWORD=${SISVAP_VOLUNTARIO_PASSWORD:?Falta SISVAP_VOLUNTARIO_PASSWORD en .env (copiá .env.example como .env)}
      - SISVAP_SECRET_KEY=${SISVAP_SECRET_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vital_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vital-net

networks:
  vital-net:
    driver: bridge